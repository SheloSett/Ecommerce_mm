# ──────────────────────────────────────────────────────────────────────────────
# COMPOSE DE PRODUCCIÓN (VPS) — APP + BASE DE DATOS
# ──────────────────────────────────────────────────────────────────────────────
# MIGRADO (08/10/2026) del VPS viejo 177.7.59.16 al VPS nuevo 82.25.74.242.
#
# Comentado: el encabezado anterior describía el VPS viejo, donde Postgres corría bare-metal.
# En el VPS nuevo no hay Postgres en el host (cada proyecto trae el suyo en Docker), así que
# la base pasó a ser el servicio `db` de este mismo compose:
# # El Postgres NO está acá a propósito: sigue corriendo bare-metal en el VPS
# # (localhost:5432), con todos tus datos, INTACTO. Este compose solo conteneriza
# # el backend (reemplaza a PM2) y el frontend (nginx interno servido detrás del
# # nginx del VPS que tiene el SSL).
#
# En el VPS nuevo:
#  · db       → Postgres 16 en el contenedor `igwtstore_db`, datos en el volumen `igwtstore_data`.
#               La contraseña sale de deploy/.env (DB_PASSWORD, no versionado).
#  · backend  → contenedor `igwtstore_backend`, habla con la base por la red interna del compose.
#  · frontend → contenedor `igwtstore_frontend` (nginx interno con la SPA).
#  · SSL y dominio los maneja el Caddy compartido del VPS (contenedor `proxy`, red `edge`),
#    con la config de deploy/igwtstore.caddy copiada en /srv/proxy/sites/.
#
# Uso (desde ~/Ecommerce_mm):
#   docker compose -f deploy/docker-compose.vps.yml up -d --build
#   docker compose -f deploy/docker-compose.vps.yml logs -f
#   docker compose -f deploy/docker-compose.vps.yml down   # NO usar `down -v`: -v borra la base
# ──────────────────────────────────────────────────────────────────────────────

# Nombre de proyecto fijo: sin esto Compose usa el nombre de la carpeta ("deploy"), demasiado
# genérico en un VPS que comparten varios proyectos.
name: igwtstore

services:
  db:
    image: postgres:16
    container_name: igwtstore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      POSTGRES_DB: ecommerce_db
      # Mismo locale que la base del VPS viejo (C.UTF-8): así los ORDER BY por texto dan
      # exactamente el mismo orden que antes de la migración.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - igwtstore_data:/var/lib/postgresql/data
    # Solo en localhost del VPS (para inspeccionar desde el host si hace falta). Nunca a internet.
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: igwtstore-backend:vps
    container_name: igwtstore_backend
    restart: unless-stopped

    # Comentado (migración 08/10/2026): network_mode host servía para llegar al Postgres
    # bare-metal del VPS viejo por localhost:5432. En el VPS nuevo la base es el servicio `db`
    # de este compose, y el Caddy compartido llega al backend por la red `edge`, así que el
    # contenedor ya no necesita compartir la red del host.
    # network_mode: host
    networks:
      - default   # para hablar con igwtstore_db
      - edge      # para que el Caddy compartido (contenedor `proxy`) llegue a igwtstore_backend:4000
    # Solo en localhost del VPS, para probar con curl desde el host. Internet entra por Caddy.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Salud del backend: /api/health ahora consulta la base (antes respondía "ok" sin mirar nada).
    # `docker ps` muestra (healthy) o (unhealthy). wget viene en la imagen alpine.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Toma las variables del mismo backend/.env de siempre (JWT_SECRET, MP_ACCESS_TOKEN, SMTP_*,
    # CLOUDINARY_*, FRONTEND_URL, etc.). En el VPS nuevo su DATABASE_URL apunta a igwtstore_db:5432.
    env_file:
      - ../backend/.env
    environment:
      PORT: 4000
      # De dónde toma el backend el index.html para las fichas de producto con Open Graph
      # (/api/og/producto/:slug): el nginx interno del contenedor del frontend.
      # Comentado (migración 08/10/2026): sin network_mode host, 127.0.0.1 es el propio
      # contenedor del backend; al frontend se llega por su nombre en la red del compose.
      # FRONTEND_INTERNAL_URL: http://127.0.0.1:8090
      FRONTEND_INTERNAL_URL: http://igwtstore_frontend:80
      # WhatsApp de avisos por Evolution (25/11/2026; ver los servicios `evolution*` más abajo y
      # backend/src/services/whatsapp.service.js). Vacías = no se manda nada por WhatsApp y todo
      # sigue por email. `evolution` y no `localhost`: adentro de la red del compose el host es el
      # nombre del servicio.
      EVOLUTION_URL: ${EVOLUTION_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCIA: ${EVOLUTION_INSTANCIA:-}
      EVOLUTION_DELAY_MS: ${EVOLUTION_DELAY_MS:-}

    # Las imágenes subidas viven FUERA del contenedor para sobrevivir a los redeploys.
    # Es la misma carpeta que ya usás; no se pierde nada.
    volumes:
      - ../backend/uploads:/app/uploads

    # IMPORTANTE — override del CMD del Dockerfile:
    # El Dockerfile por defecto corre `prisma db push --accept-data-loss` en cada arranque
    # (pensado para contenedores frescos de dev). Sobre tu base REAL eso es peligroso, así que
    # en producción NO lo corremos: acá solo arrancamos el server. Las migraciones de schema
    # se hacen a mano contra el Postgres bare-metal cuando haga falta (ver DEPLOY.md).
    command: ["node", "src/index.js"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # URL del backend horneada en el build de Vite. Default a tu dominio; se puede
        # sobreescribir exportando VITE_API_URL antes de levantar el compose.
        VITE_API_URL: ${VITE_API_URL:-https://igwtstore.com.ar}
    image: igwtstore-frontend:vps
    container_name: igwtstore_frontend
    restart: unless-stopped

    # El nginx interno del contenedor (SPA + assets) se publica SOLO en localhost:8090.
    # El nginx del VPS (que termina el SSL) hace de proxy a este puerto. No se expone
    # al exterior directamente: nadie entra por el 8090 desde internet.
    # (Se usa 8090 y no 8080 porque en el VPS el 8080 ya estaba ocupado por otro servicio.)
    # En el VPS nuevo el Caddy compartido llega por la red `edge` (igwtstore_frontend:80);
    # el 8090 en localhost queda solo para probar con curl desde el host.
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - default   # para que el backend lea el index.html (Open Graph)
      - edge      # para que el Caddy compartido llegue a igwtstore_frontend:80

  # ── WhatsApp de avisos por Evolution API (25/11/2026) ──────────────────────────
  # Copiado de Shiraf (mismo VPS), que ya lo tiene andando. Los tres servicios están detrás del
  # perfil `whatsapp`: un `up -d --build` normal NO los levanta. Para encenderlos:
  #
  #   docker compose -f deploy/docker-compose.vps.yml --profile whatsapp up -d
  #
  # 🔴 Evolution habla WhatsApp como un dispositivo vinculado (WhatsApp Web), NO por la API oficial
  # de Meta: va contra los términos de WhatsApp y el castigo es que banean el número. Por eso acá se
  # vincula SOLO la eSIM de avisos, comprada para esto, y NUNCA el número de la tienda (el de la web,
  # los flyers y Mercado Libre). Si la banean, se pierde ese chip y los emails siguen saliendo.
  #
  # Propios de IGWT (no los de Shiraf) para que si uno se cae o se actualiza el otro siga andando.
  # Variables en deploy/.env: EVOLUTION_API_KEY (larga y al azar), EVOLUTION_DB_PASSWORD,
  # EVOLUTION_URL=http://evolution:8080 y EVOLUTION_INSTANCIA (ej. igwt-avisos).
  #
  # Vincular la eSIM: el panel de Evolution no sale a internet. Desde tu PC:
  #   ssh -L 8081:127.0.0.1:8081 shelo@82.25.74.242
  # y en el navegador http://localhost:8081/manager → crear la instancia con el nombre de
  # EVOLUTION_INSTANCIA → escanear el QR con el teléfono de la eSIM.
  evolution-db:
    image: postgres:17
    container_name: igwtstore_evolution_db
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      # Con `:-` y no `:?`: Compose interpola todo el archivo aunque el perfil esté apagado, y un
      # deploy sin WhatsApp no tiene que frenarse por esta variable.
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
      POSTGRES_DB: evolution
    volumes:
      - igwtstore_evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-redis:
    image: redis:7-alpine
    container_name: igwtstore_evolution_redis
    profiles: ["whatsapp"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    # v2.3.7 + CONFIG_SESSION_PHONE_VERSION: la combinación que Shiraf comprobó que conecta (la v2.2.3
    # quedaba en bucle sin mostrar nunca el QR).
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: igwtstore_evolution
    profiles: ["whatsapp"]
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      SERVER_URL: http://localhost:8081
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: igwtstore
      # Solo lo necesario para mantener la sesión: no se guardan mensajes, contactos ni chats.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: igwtstore
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_VERSION: ${EVOLUTION_PHONE_VERSION:-2.3000.1020885143}
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
      DEL_INSTANCE: "false"
    # Solo en localhost del VPS (para el túnel del panel). 8081 y no 8080: el 8080 es el de Shiraf.
    ports:
      - "127.0.0.1:8081:8080"
    # La sesión vinculada vive acá: sobrevive a reinicios y redeploys sin volver a escanear el QR.
    volumes:
      - igwtstore_evolution_instances:/evolution/instances
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Nombre fijo para que se vea claro en `docker volume ls`. Acá viven TODOS los datos de la
  # tienda: no borrarlo nunca (ni con `docker compose down -v` ni con `docker volume prune`).
  igwtstore_data:
    name: igwtstore_data
  # WhatsApp (perfil `whatsapp`): la base propia de Evolution y la sesión vinculada de la eSIM.
  igwtstore_evolution_pgdata:
    name: igwtstore_evolution_pgdata
  igwtstore_evolution_instances:
    name: igwtstore_evolution_instances

networks:
  # Red compartida del VPS nuevo donde vive el Caddy (`proxy`). La crea el compose de /srv/proxy.
  edge:
    external: true
