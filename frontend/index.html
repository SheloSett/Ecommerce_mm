<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Antes: /favicon.png, un PNG de 7,9 MB y 2086x2048 que bajaba cada visitante nuevo (más que todo
         el resto del sitio junto) y que Google podía no mostrar por no ser cuadrado. Ahora versiones
         cuadradas del tamaño justo (48 px para la pestaña y Google, 192 para Android, 180 para iPhone).
         favicon.png quedó como copia de la de 192 por si algo lo sigue pidiendo. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título y descripción base — react-helmet-async los sobreescribe por página -->
    <title>IGWT Store</title>
    <meta name="description" content="Venta de artículos y accesorios electrónicos." />
    <!-- Open Graph por defecto (inicio, catálogo, etc.). Las fichas de producto lo reemplazan
         en el servidor (backend /api/og/producto/:slug) para que WhatsApp muestre la foto. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IGWT Store" />
    <meta property="og:title" content="IGWT Store" />
    <meta property="og:description" content="Venta de artículos y accesorios electrónicos. Envíos a todo Argentina." />
    <meta property="og:image" content="https://igwtstore.com.ar/og-image.png" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="author" content="IGWT Store" />

    <!-- Preconnect PRIMERO para que el navegador prestablezca conexión antes de descargar los fonts -->
    <!-- Antes: preconnect iba DESPUÉS del stylesheet — eso causaba FOIT en Firefox/Edge/Opera -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Material Symbols Outlined — iconos del sistema de diseño -->
    <!-- display=swap: muestra texto fallback mientras carga, luego swapea — evita texto invisible en non-Chrome -->
    <!-- Antes: display=block (texto invisible mientras carga) y sin crossorigin -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      crossorigin />

    <!-- Outfit — tipografía de títulos -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" crossorigin />

    <style>
      /* Configuración base de Material Symbols para que se vean como en el template Stitch */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 24px;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
